name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e-dummy:
    name: E2E Tests (Dummy Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Run E2E tests with dummy backend
        run: go test -v -run TestE2EMultiBackend ./test/...
        env:
          E2E_BACKENDS: "dummy"

  e2e-backends:
    name: E2E Tests (All Backends)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: etcd
            env_var: ETCD_ADDRESS
            port: 2379
          - name: consul
            env_var: CONSUL_ADDRESS
            port: 8500
          - name: zookeeper
            env_var: ZOOKEEPER_ADDRESS
            port: 2181
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Start ${{ matrix.backend.name }} service
        run: |
          docker-compose -f docker-compose.e2e.yml up -d ${{ matrix.backend.name }}
          echo "Waiting for ${{ matrix.backend.name }} to be healthy..."
          timeout 60 bash -c 'until docker-compose -f docker-compose.e2e.yml ps ${{ matrix.backend.name }} | grep -q "healthy"; do sleep 2; done' || {
            echo "${{ matrix.backend.name }} failed to become healthy"
            docker-compose -f docker-compose.e2e.yml logs ${{ matrix.backend.name }}
            exit 1
          }

      - name: Verify ${{ matrix.backend.name }} is accessible
        run: |
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if nc -zv 127.0.0.1 ${{ matrix.backend.port }} 2>&1; then
              echo "${{ matrix.backend.name }} is accessible on port ${{ matrix.backend.port }}"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "Waiting for ${{ matrix.backend.name }} to be accessible (attempt $attempt/$max_attempts)..."
            sleep 2
          done
          echo "${{ matrix.backend.name }} is not accessible after $max_attempts attempts"
          docker-compose -f docker-compose.e2e.yml logs ${{ matrix.backend.name }}
          exit 1

      - name: Run E2E tests with ${{ matrix.backend.name }}
        run: go test -v -run TestE2EMultiBackend ./test/...
        env:
          CI: "true"
          E2E_BACKENDS: "all"
          ETCD_ADDRESS: "127.0.0.1:2379"
          CONSUL_ADDRESS: "127.0.0.1:8500"
          ZOOKEEPER_ADDRESS: "127.0.0.1:2181"

      - name: Stop ${{ matrix.backend.name }} service
        if: always()
        run: |
          docker-compose -f docker-compose.e2e.yml logs ${{ matrix.backend.name }}
          docker-compose -f docker-compose.e2e.yml down -v

  e2e-all-together:
    name: E2E Tests (All Backends Together)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Start all backend services
        run: |
          docker-compose -f docker-compose.e2e.yml up -d
          echo "Waiting for all services to be healthy..."
          timeout 90 bash -c '
            until docker-compose -f docker-compose.e2e.yml ps | grep -E "(etcd|consul|zookeeper)" | grep -v "Up" | wc -l | grep -q "^0$"; do
              sleep 2
            done
          ' || {
            echo "Some services failed to start"
            docker-compose -f docker-compose.e2e.yml ps
            docker-compose -f docker-compose.e2e.yml logs
            exit 1
          }
          sleep 5

      - name: Verify all services are accessible
        run: |
          for service in "etcd:2379" "consul:8500" "zookeeper:2181"; do
            name=${service%%:*}
            port=${service##*:}
            echo "Checking $name on port $port..."
            if ! nc -zv 127.0.0.1 $port 2>&1; then
              echo "$name is not accessible on port $port"
              docker-compose -f docker-compose.e2e.yml logs $name
              exit 1
            fi
          done
          echo "All services are accessible"

      - name: Run E2E tests with all backends
        run: go test -v -run TestE2EMultiBackend ./test/... -timeout 10m
        env:
          CI: "true"
          E2E_BACKENDS: "all"
          ETCD_ADDRESS: "127.0.0.1:2379"
          CONSUL_ADDRESS: "127.0.0.1:8500"
          ZOOKEEPER_ADDRESS: "127.0.0.1:2181"

      - name: Show service logs
        if: always()
        run: docker-compose -f docker-compose.e2e.yml logs

      - name: Stop all services
        if: always()
        run: docker-compose -f docker-compose.e2e.yml down -v
