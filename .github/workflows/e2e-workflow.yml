name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e-dummy:
    name: E2E Tests (Dummy Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Run E2E tests with dummy backend
        run: go test -v -run TestE2EMultiBackend ./test/...
        env:
          E2E_BACKENDS: "dummy"

  e2e-etcd:
    name: E2E Tests (etcd)
    runs-on: ubuntu-latest
    services:
      etcd:
        image: quay.io/coreos/etcd:v3.5.14
        env:
          ETCD_NAME: etcd0
          ETCD_ADVERTISE_CLIENT_URLS: http://localhost:2379
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_INITIAL_ADVERTISE_PEER_URLS: http://localhost:2380
          ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
          ETCD_INITIAL_CLUSTER: etcd0=http://localhost:2380
          ETCD_INITIAL_CLUSTER_STATE: new
        ports:
          - 2379:2379
        options: >-
          --health-cmd "etcdctl endpoint health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - name: Run E2E tests with etcd
        run: go test -v -run TestE2EMultiBackend ./test/...
        env:
          CI: "true"
          E2E_BACKENDS: "all"
          ETCD_ADDRESS: "localhost:2379"
          CONSUL_ADDRESS: "localhost:8500"
          ZOOKEEPER_ADDRESS: "localhost:2181"

  e2e-consul:
    name: E2E Tests (consul)
    runs-on: ubuntu-latest
    services:
      consul:
        image: hashicorp/consul:1.18
        ports:
          - 8500:8500
        options: >-
          --health-cmd "consul members"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - name: Run E2E tests with consul
        run: go test -v -run TestE2EMultiBackend ./test/...
        env:
          CI: "true"
          E2E_BACKENDS: "all"
          ETCD_ADDRESS: "localhost:2379"
          CONSUL_ADDRESS: "localhost:8500"
          ZOOKEEPER_ADDRESS: "localhost:2181"

  e2e-zookeeper:
    name: E2E Tests (zookeeper)
    runs-on: ubuntu-latest
    services:
      zookeeper:
        image: zookeeper:3.9
        env:
          ZOO_MY_ID: 1
          ZOO_SERVERS: server.1=localhost:2888:3888;2181
          ZOO_4LW_COMMANDS_WHITELIST: "*"

        ports:
          - 2181:2181
        options: >-
          --health-cmd "zkServer.sh status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - name: Run E2E tests with zookeeper
        run: go test -v -run TestE2EMultiBackend ./test/...
        env:
          CI: "true"
          E2E_BACKENDS: "all"
          ETCD_ADDRESS: "localhost:2379"
          CONSUL_ADDRESS: "localhost:8500"
          ZOOKEEPER_ADDRESS: "localhost:2181"

  e2e-all-together:
    name: E2E Tests (All Backends Together)
    runs-on: ubuntu-latest
    services:
      etcd:
        image: quay.io/coreos/etcd:v3.5.14
        env:
          ETCD_NAME: etcd0
          ETCD_ADVERTISE_CLIENT_URLS: http://localhost:2379
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_INITIAL_ADVERTISE_PEER_URLS: http://localhost:2380
          ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
          ETCD_INITIAL_CLUSTER: etcd0=http://localhost:2380
          ETCD_INITIAL_CLUSTER_STATE: new
        ports:
          - 2379:2379
        options: >-
          --health-cmd "etcdctl endpoint health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      consul:
        image: hashicorp/consul:1.18
        ports:
          - 8500:8500
        options: >-
          --health-cmd "consul members"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      zookeeper:
        image: zookeeper:3.9
        env:
          ZOO_MY_ID: 1
          ZOO_SERVERS: server.1=localhost:2888:3888;2181
          ZOO_4LW_COMMANDS_WHITELIST: "*"
        ports:
          - 2181:2181
        options: >-
          --health-cmd "zkServer.sh status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - name: Run E2E tests with all backends
        run: go test -v -run TestE2EMultiBackend ./test/... -timeout 10m
        env:
          CI: "true"
          E2E_BACKENDS: "all"
          ETCD_ADDRESS: "localhost:2379"
          CONSUL_ADDRESS: "localhost:8500"
          ZOOKEEPER_ADDRESS: "localhost:2181"
