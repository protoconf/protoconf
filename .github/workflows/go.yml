name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Run startup budget gate
        run: |
          set -eo pipefail
          go test -run '^TestCompilerStartupBudget$' -count=1 -v ./compiler/lib/... | tee test-budget.log
          grep -q 'startup budget: n=' test-budget.log

      - name: Run coverage
        run: |
          # SC2155: declare and assign separately. This GOROOT export looks like
          # a stale workaround -- setup-go already sets it -- but it is left in
          # place rather than deleted, since nothing here proves it is dead.
          GOROOT="$(go env GOROOT)"
          export GOROOT
          # No -race: compiler/lib and server peak near 8 GB each under it, and four packages
          # at once overran the 16 GB runner, which killed the step with SIGTERM (exit 143).
          # The budget test is wall-clock: the gate step above runs it alone. Here it would
          # share the CPU with other packages and coverage, and miss its budget.
          go test -skip '^TestCompilerStartupBudget$' -coverprofile=coverage.txt -covermode=atomic -v ./... -json > test_results.json

      - name: Test report
        if: always()
        run: go run gotest.tools/gotestsum@v1.13.0 --format testdox --raw-command -- cat test_results.json

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Go-results
          path: test_results.json
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
            token: ${{ secrets.CODECOV_TOKEN }}

  # Separate job: runs beside the tests, so it cannot push build past its timeout,
  # and a failing test does not withhold the binaries.
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Same flags as .goreleaser.yaml, so a PR binary behaves like a release one.
      - name: Build protoconf binaries
        env:
          CGO_ENABLED: "0"
          # The PR head, not the merge commit GitHub builds for pull_request events.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build \
              -ldflags "-s -w -X github.com/protoconf/protoconf/consts.Version=0.0.0-${SHA::8}" \
              -o "dist/protoconf-${target%/*}-${target#*/}" ./cmd/protoconf
          done

      - name: Upload protoconf binaries
        uses: actions/upload-artifact@v7
        with:
          name: protoconf-binaries
          path: dist/
          retention-days: 14
