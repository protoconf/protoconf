name: Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # only-new-issues holds the line against the existing 84-issue backlog
  # (50 errcheck, 15 govet, 15 staticcheck, 3 unused, 1 ineffassign) rather
  # than blocking every PR on pre-existing findings.
  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          only-new-issues: true

  buf-breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Make main available locally
        run: |
          git fetch origin main
          git branch -f main origin/main

      - uses: bufbuild/buf-setup-action@v1

      - name: Check for breaking changes
        run: buf breaking --against '.git#branch=main' --against-config buf.yaml

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint workflow files
        uses: raven-actions/actionlint@v2
