name: Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The backlog is cleared -- `golangci-lint run --max-issues-per-linter=0
  # --max-same-issues=0` reports 0 issues at v2.13.2 (quick-260909-hv9).
  # The gate is now absolute: only-new-issues is off, so any new finding
  # fails the job, not just findings on changed lines.
  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          only-new-issues: false

  buf-breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Make main available locally
        run: |
          git fetch origin main
          git branch -f main origin/main

      - uses: bufbuild/buf-setup-action@v1

      - name: Check for breaking changes
        run: buf breaking --against '.git#branch=main' --against-config buf.yaml

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint workflow files
        uses: raven-actions/actionlint@v2
