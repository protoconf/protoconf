name: E2E - etcd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    services:
      etcd:
        image: quay.io/coreos/etcd:v3.5.0
        ports:
          - 2379:2379
        options: >-
          --name etcd-test
          --data-dir /tmp/etcd-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Run coverage
        run: export GOROOT=$(go env GOROOT); go test -v ./test -json > test_results.json
        env:
          PROTOCONF_AGENT_STORE: etcd
          PROTOCONF_AGENT_SERVERS: http://localhost:2379

      - name: Test report
        if: always()
        run: cat test_results.json | go run gotest.tools/gotestsum@latest --format testdox

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Go-results
          path: test_results.json
